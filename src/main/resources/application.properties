spring.application.name=ControleFinanceiroAPI

server.port=${PORT:8080}

# ── Banco de Dados ────────────────────────────────────────────────
# Em desenvolvimento: usa PostgreSQL local
# Em produção (Render+Supabase): DATABASE_URL é injetada como variável de ambiente
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ControleFinanceiro}
spring.datasource.username=${DATABASE_USERNAME:hugo}
spring.datasource.password=${DATABASE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── JWT ───────────────────────────────────────────────────────────
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
api.security.token.expiration=86400000

# ── Health Check (necessário para monitoramento no Render) ────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.application.name=ControleFinanceiroAPI

server.port=${PORT:8080}

# Conexão com o Banco de Dados com variáveis dinâmicas
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ControleFinanceiro}
spring.datasource.username=${DATABASE_USERNAME:hugo}
spring.datasource.password=${DATABASE_PASSWORD:1234}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true